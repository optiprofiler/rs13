name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:00 Beijing time.
    - cron: "0 23 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Bootstrap the API-v1 protocol under development
        shell: bash
        run: |
          protocol_file="optiprofiler/python/optiprofiler/problem_libraries.py"
          if ! test -f "$protocol_file" || ! grep -q "class ProblemLibraryPlugin" "$protocol_file"; then
            git -C optiprofiler fetch --depth=1 origin python
            git -C optiprofiler checkout --detach FETCH_HEAD
          fi
          grep -q "PROBLEM_LIBRARY_API_VERSION = 1" "$protocol_file"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e optiprofiler
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Download official RS13 inputs
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/rs13"
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/rs13pm.zip" \
            https://minlp-downloads.nyc3.cdn.digitaloceanspaces.com/testlibs/dfolibs/rs13pm.zip
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/rs13sols.zip" \
            https://minlp-downloads.nyc3.cdn.digitaloceanspaces.com/testlibs/dfolibs/rs13sols.zip
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/problemdata.zip" \
            https://sahinidis.coe.gatech.edu/public/problemdata.zip
          unzip -q "$RUNNER_TEMP/rs13/rs13pm.zip" -d "$RUNNER_TEMP/rs13/rs13pm_unzipped"
          unzip -q "$RUNNER_TEMP/rs13/rs13sols.zip" -d "$RUNNER_TEMP/rs13/rs13sols_unzipped"
          unzip -q "$RUNNER_TEMP/rs13/problemdata.zip" -d "$RUNNER_TEMP/rs13/problemdata_unzipped"
          echo "RS13PM_DIR=$(find "$RUNNER_TEMP/rs13/rs13pm_unzipped" -type f -name branin.py -exec dirname {} \; -quit)" >> "$GITHUB_ENV"
          echo "RS13SOLS_DIR=$(find "$RUNNER_TEMP/rs13/rs13sols_unzipped" -type f -name branin.sol -exec dirname {} \; -quit)" >> "$GITHUB_ENV"
          echo "RS13_PROBLEMDATA_DIR=$(find "$RUNNER_TEMP/rs13/problemdata_unzipped" -type f -name branin.problem.data -exec dirname {} \; -quit)" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("probinfo_rs13.csv") for name in names)
          forbidden = ("rs13pm/", "rs13sols/", "problemdata/", ".zip")
          assert not any(part in name for name in names for part in forbidden)
          PY

      - name: Fresh installed plugin smoke
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          python -m pip uninstall -y optiprofiler-rs13
          python -m pip install --no-deps "$wheel"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          python - <<'PY'
          from optiprofiler.problem_libraries import (
              list_problem_libraries,
              load_problem_library,
              resolve_problem_library,
          )

          assert "rs13" in list_problem_libraries()
          plugin = load_problem_library(resolve_problem_library("rs13"))
          plugin.check_available()
          problem = plugin.load("branin", {})
          assert problem.n == 2
          assert abs(float(problem.fun(problem.x0)) - 24.129964413622268) < 1e-12
          PY

      - name: Check generated metadata
        run: |
          python scripts/collect_info.py
          git diff --exit-code probinfo_rs13.csv

      - name: Run smoke check
        run: python scripts/smoke_rs13.py
