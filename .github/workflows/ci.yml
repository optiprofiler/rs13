name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:00 Beijing time.
    - cron: "0 23 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OP_TEST_V2: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          # The exact 2.0.0 core this provider release was accepted with.
          ref: ec130fb4e2fd7e59204bc4696d36b30eb2fa9da3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=61" wheel
          python -m pip install -e optiprofiler
          python -m pip install -e . --no-build-isolation

      - name: Run API-v1 protocol tests
        run: python -m unittest discover -s tests -p 'test_plugin_protocol.py'

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution contents
        run: python scripts/check_distribution.py

      - name: Run bundled runtime tests without RS13 environment variables
        run: |
          env -u RS13PM_DIR -u RS13SOLS_DIR -u RS13_PROBLEMDATA_DIR \
            python -m unittest discover -s tests -p 'test_rs13.py'

      - name: Download RS13 solution oracle
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/rs13"
          curl -L --fail --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/rs13sols.zip" \
            https://minlp-downloads.nyc3.cdn.digitaloceanspaces.com/testlibs/dfolibs/rs13sols.zip
          echo "81d72d6aeb0e6ca38040f51cead3225b3eed6040dc9307fbe49b566b73a4ab72  $RUNNER_TEMP/rs13/rs13sols.zip" \
            | sha256sum --check -
          unzip -q "$RUNNER_TEMP/rs13/rs13sols.zip" -d "$RUNNER_TEMP/rs13/rs13sols_unzipped"
          rs13sols_dir=$(find "$RUNNER_TEMP/rs13/rs13sols_unzipped" -type f -name branin.sol -exec dirname {} \; -quit)
          test -n "$rs13sols_dir"
          echo "RS13SOLS_DIR=$rs13sols_dir" >> "$GITHUB_ENV"
          echo "RS13_REFERENCE_SOLUTIONS_ARCHIVE=$RUNNER_TEMP/rs13/rs13sols.zip" >> "$GITHUB_ENV"

      - name: Run solution-oracle tests
        run: python -m unittest discover -s tests -p 'test_rs13.py'

      - name: Run reference and OptiProfiler 2.0 contract tests
        run: |
          python -m unittest discover -s tests -p 'test_reference*.py'
          python -m unittest discover -s tests -p 'test_v2_contract.py'

      - name: Fresh installed plugin smoke
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          python -m pip uninstall -y optiprofiler-rs13
          python -m pip install "$wheel"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          env -u RS13PM_DIR -u RS13SOLS_DIR -u RS13_PROBLEMDATA_DIR python - <<'PY'
          from optiprofiler.problem_libraries import (
              list_problem_libraries,
              load_problem_library,
              resolve_problem_library,
          )

          assert "rs13" in list_problem_libraries()
          plugin = load_problem_library(resolve_problem_library("rs13"))
          plugin.check_available()
          problem = plugin.load("branin", {})
          assert problem.n == 2
          assert abs(float(problem.fun(problem.x0)) - 24.129964413622268) < 1e-12
          assert plugin.load("rosenbr", {}).reference.kind == "feasible"
          PY

      - name: Run smoke check
        run: python scripts/smoke_rs13.py
