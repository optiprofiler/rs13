name: Upstream Data Audit

on:
  schedule:
    # 07:20 Beijing time, after the daily runtime CI.
    - cron: "20 23 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Download official RS13 maintenance inputs
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/rs13"
          curl -L --fail --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/rs13pm.zip" \
            https://minlp-downloads.nyc3.cdn.digitaloceanspaces.com/testlibs/dfolibs/rs13pm.zip
          curl -L --fail --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/rs13sols.zip" \
            https://minlp-downloads.nyc3.cdn.digitaloceanspaces.com/testlibs/dfolibs/rs13sols.zip
          curl -L --fail --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/rs13/problemdata.zip" \
            https://sahinidis.coe.gatech.edu/public/problemdata.zip
          unzip -q "$RUNNER_TEMP/rs13/rs13pm.zip" -d "$RUNNER_TEMP/rs13/rs13pm_unzipped"
          unzip -q "$RUNNER_TEMP/rs13/rs13sols.zip" -d "$RUNNER_TEMP/rs13/rs13sols_unzipped"
          unzip -q "$RUNNER_TEMP/rs13/problemdata.zip" -d "$RUNNER_TEMP/rs13/problemdata_unzipped"
          rs13pm_dir=$(find "$RUNNER_TEMP/rs13/rs13pm_unzipped" -type f -name branin.py -exec dirname {} \; -quit)
          rs13sols_dir=$(find "$RUNNER_TEMP/rs13/rs13sols_unzipped" -type f -name branin.sol -exec dirname {} \; -quit)
          problemdata_dir=$(find "$RUNNER_TEMP/rs13/problemdata_unzipped" -type f -name branin.problem.data -exec dirname {} \; -quit)
          test -n "$rs13pm_dir"
          test -n "$rs13sols_dir"
          test -n "$problemdata_dir"
          echo "RS13PM_DIR=$rs13pm_dir" >> "$GITHUB_ENV"
          echo "RS13SOLS_DIR=$rs13sols_dir" >> "$GITHUB_ENV"
          echo "RS13_PROBLEMDATA_DIR=$problemdata_dir" >> "$GITHUB_ENV"

      - name: Run cross-source problemdata audit
        run: python -m unittest discover -s tests -p 'test_upstream_data_audit.py'

      - name: Regenerate and compare metadata
        run: |
          python scripts/collect_info.py
          git diff --exit-code probinfo_rs13.csv
